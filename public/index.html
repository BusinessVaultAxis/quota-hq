<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quota HQ</title><link rel="icon" href="/logo.svg"><meta name="theme-color" content="#0F1210"><script>// Runs the Quota HQ page against the Quota server instead of claude.ai.
(function(){
  const subs={},state={data:null};let timer=null;
  const api=async(method,url,body)=>{const r=await fetch(url,{method,credentials:"same-origin",headers:body!==undefined?{"Content-Type":"application/json"}:{},body:body!==undefined?JSON.stringify(body):undefined});
    if(r.status===401){location.href="/login";throw new Error("signed out")}const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||"Request failed");e.code=r.status;throw e}return j};
  const snap=c=>({docs:((state.data&&state.data[c])||[]).map(d=>({id:d.id,data:()=>{const o=Object.assign({},d);delete o.id;return o}}))});
  const emit=()=>{for(const c in subs)subs[c].forEach(cb=>{try{cb(snap(c))}catch(e){console.error(e)}})};
  async function load(){try{state.data=await api("GET","/api/data");window.QHQ.me=state.data._me;window.QHQ.pre=!!state.data._pre;window.QHQ.repGoals=state.data._repGoals||null;if(state.data._me.role==="admin")await Promise.all([window.QHQ.loadApplicants(),window.QHQ.loadUsers()]);emit()}catch(e){console.error(e)}}
  const after=async r=>{await load();return r};
  const col=c=>({
    onSnapshot(cb){(subs[c]=subs[c]||[]).push(cb);if(state.data)setTimeout(()=>cb(snap(c)),0);return()=>{subs[c]=subs[c].filter(x=>x!==cb)}},
    add:data=>api("POST","/api/doc/"+c,data).then(r=>after({id:r.id})),
    doc:id=>({
      set:data=>c==="claims"?Promise.resolve():api("PUT","/api/doc/"+c+"/"+encodeURIComponent(id),data).then(after),
      update:data=>c==="claims"?Promise.resolve():api("PATCH","/api/doc/"+c+"/"+encodeURIComponent(id),data).then(after),
      delete:()=>c==="claims"?Promise.resolve():api("DELETE","/api/doc/"+c+"/"+encodeURIComponent(id)).then(after),
      get:async()=>{const d=((state.data&&state.data[c])||[]).find(x=>x.id===id);return{exists:!!d,data:()=>d}}
    })});

    const [c,id]=p.split("/");return col(c).doc(id)}};
  const user={canEdit:async()=>{if(!state.data)await load();return !!(state.data&&state.data._me.role==="admin")},isOwner:async()=>false,can:async()=>null,
    me:async()=>{if(!state.data)await load();const m=state.data._me;return{id:m.id,email:m.email,name:"",isOwner:false}}};
  const downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".csv")?"text/csv":"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return{status:"saved"}}};

    loadUsers:async()=>{try{window.QHQ.users=await api("GET","/api/users")}catch(e){window.QHQ.users=[]}return window.QHQ.users},
    invite:(repId,email)=>api("POST","/api/users/invite",{repId,email}),
    revoke:id=>api("DELETE","/api/users/"+id),
    logout:()=>api("POST","/api/logout",{}).then(()=>{location.href="/login"}),
    applicants:[],recruitLink:()=>api("GET","/api/recruit-link"),
    loadApplicants:async()=>{try{window.QHQ.applicants=await api("GET","/api/applicants")}catch(e){window.QHQ.applicants=[]}return window.QHQ.applicants},
    approve:(id,scale)=>api("POST","/api/applicants/"+id+"/approve",{scale}).then(async r=>{await load();await window.QHQ.loadApplicants();return r}),

<script>
(function(){
const ALLTABS=[["dash","Dashboard"],["mine","My view"],["goals","Goals"],["sales","Sales"],["team","Reps"],["payout","Payouts"],["comm","Commissions"],["exp","Expenses"],["inc","Incentives"],["pay","Pay plans"],["areas","Areas"],["partners","Partners"]];let TABS=ALLTABS;
const NAVG={dash:"Overview",sales:"Team",payout:"Money",pay:"Setup"};
let previewRep=null;const RV=()=>repMode||previewRep;
const repTabs=id=>[["r_home","Home"],["r_pay","Pay"],["r_pipe","Pipeline"],["r_goals","Goals"],["r_board","Team"]];
let MYGOAL=0,MYPREF={},MINE_CTX=null,myName="",repMode=null,myUid=null,myEmail=null,CLAIMS=[],linkPick="";
const COLS=["reps","rates","sales","expenses","incentives","goals","partners","crews","territories"].concat(window.QHQ?["reviews"]:[]);
const D={reps:[],rates:[],sales:[],expenses:[],incentives:[],goals:[],reviews:[]};
const isMgr=()=>!!(window.QHQ&&window.QHQ.me&&window.QHQ.me.role==="manager");
let db=null,canEdit=true,tab="dash",loaded=0,salesFilter="all",salesStatus="all";
try{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))tab=h;}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const money=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString();
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const fmtD=s=>{if(!s)return"—";const [y,m,d]=s.split("-");return new Date(+y,+m-1,+d).toLocaleDateString(undefined,{month:"short",day:"numeric"})};
const FIBER_PROV=["Kinetic","AT&T Fiber","Verizon Fios"],PHONE_PROV=["AT&T","Verizon"];
const FIBER_PROD=["500 Mbps","1 Gig","2 Gig","5 Gig"],PHONE_PROD=["New line","Upgrade","BYOD"];
const EXP_CAT=["Flights","Housing","Hotel","Rental car","Gas","Food","Tickets & events","Supplies","Other"];
const ROLES=["Owner","Manager","Team lead","Rep"];

function range(){
  const p=$("#period").value,t=new Date(),y=t.getFullYear(),m=t.getMonth();
  if(p==="week"){const d=new Date(t);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);const e=new Date(d);e.setDate(d.getDate()+6);return{s:ymd(d),e:ymd(e)}}
  if(p==="month")return{s:ymd(new Date(y,m,1)),e:ymd(new Date(y,m+1,0))};
  if(p==="last")return{s:ymd(new Date(y,m-1,1)),e:ymd(new Date(y,m,0))};
  if(p==="ytd")return{s:y+"-01-01",e:y+"-12-31"};
  return{s:"0000-01-01",e:"9999-12-31"};
}
const inR=(d,R)=>!!d&&d>=R.s&&d<=R.e;
const rep=id=>D.reps.find(r=>r.id===id);
const repName=id=>{const r=rep(id);return r?r.name:"Unassigned"};
const me=()=>D.reps.find(r=>r.me);
const initials=n=>(n||"?").trim().charAt(0).toUpperCase();
const qty=s=>Math.max(1,num(s.qty)||1);
const doneDate=s=>s.installDate||s.date;

function downline(id,seen){seen=seen||new Set();if(seen.has(id))return[];seen.add(id);let out=[id];D.reps.filter(r=>r.managerId===id).forEach(r=>{out=out.concat(downline(r.id,seen))});return out}

function repStats(R){
  const m={};D.reps.forEach(r=>m[r.id]={sold:0,cx:0,inst:0,fiber:0,lines:0,pend:0,earned:0,ovr:0,rev:0});
  D.sales.forEach(s=>{
    const st=m[s.repId];if(!st)return;const q=qty(s);
    if(inR(s.date,R)&&!s.preQuota){if(s.status==="cancelled")st.cx+=1;else st.sold+=1;if(s.status==="pending")st.pend+=1}
    if(s.status==="done"&&inR(doneDate(s),R)){
      st.inst+=1;if(s.type==="phone")st.lines+=q;else st.fiber+=1;
      st.earned+=num(s.repPay)*q;st.rev+=num(s.revenue)*q;
      for(const a in (s.ovr||{}))if(m[a])m[a].ovr+=s.ovr[a]*q;
    }
  });return m;
}
function roll(ids,m){const t={sold:0,cx:0,inst:0,fiber:0,lines:0,pend:0,earned:0,ovr:0,rev:0};ids.forEach(i=>{const s=m[i];if(s)for(const k in t)t[k]+=s[k]});return t}

function incProgress(inc){
  const per={};D.reps.forEach(r=>per[r.id]=0);
  D.sales.forEach(s=>{if(per[s.repId]===undefined)return;
    const d=inc.metric==="sales"?s.date:doneDate(s);if(!(d>=inc.start&&d<=inc.end))return;
    if(inc.metric==="sales"){if(s.status!=="cancelled")per[s.repId]+=1}
    else if(s.status==="done"){if(inc.metric==="lines"){if(s.type==="phone")per[s.repId]+=qty(s)}else if(s.type!=="phone")per[s.repId]+=1}
  });
  let ids=D.reps.map(r=>r.id);if(inc.repId)ids=downline(inc.repId);
  const target=num(inc.target),reward=num(inc.reward);
  if(inc.scope==="team"){const tot=ids.reduce((a,i)=>a+(per[i]||0),0);return{tot,target,hit:tot>=target&&target>0?1:0,cost:tot>=target&&target>0?reward:0,per,ids}}
  const q=ids.filter(i=>target>0&&per[i]>=target);return{tot:null,target,hit:q.length,cost:q.length*reward,per,ids,q};
}

function totals(R){
  const m=repStats(R),all=roll(D.reps.map(r=>r.id),m);
  const exp=D.expenses.filter(e=>inR(e.date,R)).reduce((a,e)=>a+num(e.amount),0);
  const inc=D.incentives.filter(i=>inR(i.end,R)).reduce((a,i)=>a+incProgress(i).cost,0);
  const nm=D.reps.filter(r=>!r.me),rp=nm.reduce((a,r)=>a+m[r.id].earned,0),ro=nm.reduce((a,r)=>a+m[r.id].ovr,0);
  return{m,all,exp,inc,repPay:rp,ovr:ro,net:all.rev-rp-ro-exp-inc};
}

const THK="qhq-theme";function applyTheme(v){v=v||"auto";if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",v);document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeSet===v)))}
let THEME="auto";try{THEME=localStorage.getItem(THK)||"auto"}catch(e){}applyTheme(THEME);

  $("#tabs").innerHTML=TABS.map(([k,l])=>(!RV()&&NAVG[k]?`<p class="nav-g" role="presentation">${NAVG[k]}</p>`:"")+`<button role="tab" type="button" class="${many&&!MPRI.includes(k)?"m-hide":""}" data-tab="${k}" aria-selected="${k===tab}" aria-label="${l}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICO[k]}"/></svg><span>${l}</span></button>`).join("")+(many?`<button type="button" class="more-only" data-more="1" aria-selected="${inMore}" aria-label="More sections"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${MORE_ICO}" stroke-width="3"/></svg><span>${inMore?(TABS.find(t=>t[0]===tab)||[])[1]:"More"}</span></button>`:"")}

const pd=s=>{const [y,m,d]=s.split("-");return new Date(+y,+m-1,+d)};
function prevRange(R){if(R.s==="0000-01-01")return null;const s=pd(R.s),e=pd(R.e<today()?R.e:today());const days=Math.round((e-s)/864e5)+1;const pe=new Date(s);pe.setDate(pe.getDate()-1);const ps=new Date(pe);ps.setDate(ps.getDate()-days+1);return{s:ymd(ps),e:ymd(pe)}}
function curRange(R){return{s:R.s,e:R.e<today()?R.e:today()}}
function buckets(R){
  let s=R.s;if(s==="0000-01-01"){const ds=D.sales.map(x=>x.date).concat(D.expenses.map(x=>x.date)).filter(Boolean).sort();s=ds[0]||today();}
  const e=R.e<today()?R.e:today();let a=pd(s),b=pd(e);if(b<a)b=new Date(a);
  const span=Math.round((b-a)/864e5)+1,out=[];
  if(span<=35){for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))out.push({s:ymd(d),e:ymd(d),l:d.toLocaleDateString(undefined,{month:"short",day:"numeric"})})}
  else if(span<=150){for(let d=new Date(a);d<=b;d.setDate(d.getDate()+7)){const z=new Date(d);z.setDate(z.getDate()+6);out.push({s:ymd(d),e:ymd(z),l:d.toLocaleDateString(undefined,{month:"short",day:"numeric"})})}}
  else{for(let d=new Date(a.getFullYear(),a.getMonth(),1);d<=b;d=new Date(d.getFullYear(),d.getMonth()+1,1))out.push({s:ymd(d),e:ymd(new Date(d.getFullYear(),d.getMonth()+1,0)),l:d.toLocaleDateString(undefined,{month:"short",year:"2-digit"})})}
  return out;
}
const costOf=s=>{const mi=(D.reps.find(r=>r.me)||{}).id;let c=s.repId===mi?0:num(s.repPay);for(const a in (s.ovr||{}))if(a!==mi)c+=s.ovr[a];return c};
function series(bks){
  const z=()=>bks.map(()=>0),o={rev:z(),cost:z(),fiber:z(),lines:z(),sold:z()};
  const ix=d=>{if(!d)return -1;for(let i=0;i<bks.length;i++)if(d>=bks[i].s&&d<=bks[i].e)return i;return -1};
  D.sales.forEach(s=>{const i=ix(s.date);if(i>=0&&s.status!=="cancelled"&&!s.preQuota)o.sold[i]++;
    if(s.status==="done"){const j=ix(doneDate(s));if(j>=0){const q=qty(s);o.rev[j]+=num(s.revenue)*q;o.cost[j]+=costOf(s)*q;if(s.type==="phone")o.lines[j]+=q;else o.fiber[j]++}}});
  D.expenses.forEach(e=>{const i=ix(e.date);if(i>=0)o.cost[i]+=num(e.amount)});
  return o;
}
const niceMax=v=>{if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p};
const short=n=>Math.abs(n)>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,"")+"M":Math.abs(n)>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,"")+"k":String(Math.round(n));
function spark(vals){const W=100,H=30,mx=Math.max(1,...vals),n=vals.length;if(n<2)return"";const pts=vals.map((v,i)=>[i/(n-1)*W,H-2-(v/mx)*(H-4)]);const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="sp-area" d="${d}L${W} ${H}L0 ${H}Z"/><path class="sp-line" d="${d}"/></svg>`}
function lineChart(bks,lines,fmt){
  const W=640,H=220,L=48,Rt=10,Tp=10,B=26,iw=W-L-Rt,ih=H-Tp-B,n=bks.length;const mx=niceMax(Math.max(1,...lines.flatMap(l=>l.v)));
  const x=i=>L+(n<2?iw/2:i/(n-1)*iw),y=v=>Tp+ih-(v/mx)*ih;let g="";
  for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line class="gl" x1="${L}" x2="${W-Rt}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  const step=Math.max(1,Math.ceil(n/7));bks.forEach((b,i)=>{if(i%step===0||i===n-1)g+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${esc(b.l)}</text>`});
  lines.forEach(l=>{const d=l.v.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join("");
    if(l.area)g+=`<path d="${d}L${x(n-1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="${l.c}" opacity=".12"/>`;
    g+=`<path d="${d}" fill="none" stroke="${l.c}" stroke-width="2.5" stroke-linejoin="round" ${l.dash?'stroke-dasharray="5 4"':""}/>`;
    const li=n-1;g+=`<circle cx="${x(li)}" cy="${y(l.v[li]||0)}" r="4" fill="${l.c}"/>`});

function barChart(bks,stacks){
  const W=640,H=200,L=36,Rt=6,Tp=10,B=26,iw=W-L-Rt,ih=H-Tp-B,n=bks.length;const tot=bks.map((_,i)=>stacks.reduce((a,s)=>a+s.v[i],0));const mx=niceMax(Math.max(1,...tot));

  bks.forEach((b,i)=>{let acc=0;const bx=L+i*bw+bw*.18,w=Math.max(1,bw*.64);stacks.forEach(s=>{const v=s.v[i];if(v>0){g+=`<rect x="${bx}" y="${y(acc+v)}" width="${w}" height="${y(acc)-y(acc+v)}" fill="${s.c}" rx="2"/>`;acc+=v}});});
  const step=Math.max(1,Math.ceil(n/7));bks.forEach((b,i)=>{if(i%step===0)g+=`<text class="ax" x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${esc(b.l)}</text>`});
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Installs chart">${g}</svg></div>`;
}
function delta(cur,prev,invert){if(prev==null)return`<span class="d">All time</span>`;if(!prev&&!cur)return`<span class="d">No change</span>`;if(!prev)return`<span class="d up">New vs last period</span>`;

function agg(ids,R){const set=new Set(ids),s={sold:0,inst:0,pend:0,cx:0,pay:0,ppay:0,ovr:0,povr:0,rev:0,prev:0};
  D.sales.forEach(x=>{if(!set.has(x.repId))return;const q=qty(x),p=num(x.repPay)*q,o=num(x.override)*q,r=num(x.revenue)*q;
    if(inR(x.date,R)&&!x.preQuota){if(x.status==="cancelled")s.cx++;else s.sold++}
    if(x.status==="pending"){s.pend++;s.ppay+=p;s.povr+=o;s.prev+=r}
    if(x.status==="done"&&inR(doneDate(x),R)){s.inst++;s.pay+=p;s.ovr+=o;s.rev+=r}});return s}

const AST={available:["Available","p-done"],blitzing:["Blitzing","p-you"],reserved:["Reserved","p-pend"],requested:["Requested","p-pend"],cooldown:["Cool down","p-tag"],inactive:["Inactive","p-cx"]};
const PTYPES=["Master dealer / platform","ISP direct","Marketing company","Dealer / team"];
const hav=(a,b)=>{if(!a||!b||!a.lat||!b.lat)return null;const R=3959,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)))};
const crewReps=c=>c?D.reps.filter(r=>(r.team||"")===c.name&&!/fail|inactive|quit|termin/i.test(r.status||"")):[];
const areaReps=t=>{const s=new Set(t.repIds||[]);if(t.crewId)crewReps((D.crews||[]).find(c=>c.id===t.crewId)).forEach(r=>s.add(r.id));return[...s]};
const assigned=t=>!!(t.crewId||(t.repIds||[]).length);
const liveA=t=>assigned(t)&&(!t.end||t.end>=today());
const addD=(d,n)=>{const x=pd(d);x.setDate(x.getDate()+n);return ymd(x)};
function areaStats(t){const ids=new Set(areaReps(t)),st=t.start||"0000",en=t.end&&t.end<today()?t.end:today(),isp=(t.isp||"").toLowerCase().split(/[\/ ]/)[0];

  const days=Math.max(1,Math.round((pd(en)-pd(st))/864e5)+1),wk=l.filter(s=>s.date>addD(en,-7)).length,prior=l.filter(s=>s.date<=addD(en,-7)&&s.date>addD(en,-14)).length;
  return{sold:l.filter(s=>s.status!=="cancelled").length,inst:l.filter(s=>s.status==="done").length,days,reps:ids.size,perRepDay:ids.size?l.filter(s=>s.status!=="cancelled").length/ids.size/days:0,wk,prior}}
function rotCue(t,a){if(a.days>=98)return["Past 14 weeks. Rotate out","p-cx"];if(a.days>=14&&a.prior>=4&&a.wk<a.prior*0.6)return["Sales down "+Math.round((1-a.wk/a.prior)*100)+"% vs last week. Plan next area","p-pend"];if(a.days>=28)return["4+ weeks in. Line up the next area","p-pend"];return["On track","p-done"]}
function fitScore(t,base){let s=Math.sqrt(Math.min(t.leads||0,15000))/10;if(t.rested>=60)s+=3;else if(t.rested>=30)s+=1;else if(t.rested!=null&&t.rested<14)s-=2;if(t.tag==="🔥")s+=0.5;const d=hav(base,t);if(d!=null)s-=d/250;return s}

const STN={AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming"};
const areaMatch=(t,q)=>{const h=areaHay(t),st=(t.city.split(",").pop()||"").trim().toUpperCase(),Q=q.toLowerCase().trim();if(!Q)return true;
  const full=Object.entries(STN).filter(([k,v])=>Q.includes(v.toLowerCase()));let rest=Q;full.forEach(([k,v])=>{rest=rest.replace(v.toLowerCase()," ")});
  if(full.length&&!full.some(([k])=>k===st))return false;
  return rest.split(/[\s,]+/).filter(Boolean).every(w=>w.length===2&&STN[w.toUpperCase()]?w.toUpperCase()===st:h.includes(w))};
const areaHay=t=>{if(t._h)return t._h;const st=(t.city.split(",").pop()||"").trim().toUpperCase();return t._h=(t.city+" "+t.isp+" "+st+" "+(STN[st]||"")).toLowerCase()};
function vAreas(){const A=ST.ar=ST.ar||{q:"",isp:"",st:"available",state:"",sort:"fit",n:40};const T=D.territories||[];
  const live=T.filter(liveA),base=A.base?T.find(t=>t.id===A.base):live[0];
  const cnt={};T.forEach(t=>{cnt[t.lstatus]=(cnt[t.lstatus]||0)+1});
  const isps=[...new Set(T.map(t=>t.isp))].sort(),states=[...new Set(T.map(t=>(t.city.split(",").pop()||"").trim().toUpperCase()))].filter(Boolean).sort();

function findRate(type,prov,prod,repId){
  const m=r=>(r.category||"fiber")===type&&String(r.provider).toLowerCase()===String(prov).toLowerCase()&&String(r.product).toLowerCase()===String(prod).toLowerCase();
  return D.rates.find(r=>m(r)&&r.repId===repId)||D.rates.find(r=>m(r)&&!r.repId);
}
function saleHook(form,isNew){
  const g=n=>form.elements[n];
  const lists=()=>{const t=g("type").value;const pv=(t==="phone"?PHONE_PROV:FIBER_PROV).concat(D.rates.filter(r=>(r.category||"fiber")===t).map(r=>r.provider));
    $("#dlProv").innerHTML=[...new Set(pv)].map(a=>`<option value="${esc(a)}">`).join("");
    const pd=(t==="phone"?PHONE_PROD:FIBER_PROD).concat(D.rates.filter(r=>(r.category||"fiber")===t&&(!g("provider").value||r.provider===g("provider").value)).map(r=>r.product));
    $("#dlProd").innerHTML=[...new Set(pd)].map(a=>`<option value="${esc(a)}">`).join("")};
  const calc=()=>{const q=Math.max(1,num(g("qty").value)||1),p=num(g("repPay").value)*q,o=num(g("override").value)*q,r=num(g("revenue").value)*q;
    $("#calc").innerHTML=`<div>Rep earns<b>${money(p)}</b></div><div>Override<b>${money(o)}</b></div><div>Quota gets<b>${money(r)}</b></div><div>Quota keeps<b>${money(r-p-o)}</b></div>`};
  const fill=()=>{const rt=findRate(g("type").value,g("provider").value,g("product").value,g("repId").value);
    if(rt){g("repPay").value=num(rt.repPay);g("override").value=num(rt.override);g("revenue").value=num(rt.revenue)}calc()};
  ["type","provider","product","repId"].forEach(n=>g(n).addEventListener("change",()=>{lists();fill()}));
  ["qty","repPay","override","revenue"].forEach(n=>g(n).addEventListener("input",calc));
  g("status").addEventListener("change",()=>{if(g("status").value==="done"&&!g("installDate").value)g("installDate").value=today()});
  lists();if(isNew)fill();else calc();
}

function openForm(col,id,preset){
  if(!canEdit&&!(isMgr()&&col==="expenses")){toast(isMgr()?"Managers can add expenses only":"You have view access only");return}
  if(isMgr()&&id){const ex=D.expenses.find(x=>x.id===id);if(ex&&window.QHQ.me&&ex.by!==window.QHQ.me.email){toast("Only the person who added this expense can change it");return}}
  const spec=FORMS[col],rec=id?(D[col].find(x=>x.id===id)||{}):(preset||{}),isNew=!id;
  $("#sheetRoot").innerHTML=`<div class="sheet-back" id="sb"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="sheet-h"><h2 id="sh">${isNew?"New":"Edit"} ${spec.t.toLowerCase()}</h2><button class="x" type="button" id="sx" aria-label="Close">×</button></div>
  <form class="f" id="ff" novalidate>${spec.body(rec)}<div class="acts">${isNew||rec.src==="league"?"":`<button type="button" class="btn btn-bad sp" id="del">Delete</button>`}<button type="button" class="btn btn-out" id="cancel">Cancel</button><button class="btn btn-lime" type="submit">${isNew?"Save":"Save changes"}</button></div></form></div></div>`;
  const form=$("#ff");const sel=spec.sel?spec.sel(rec):{};for(const k in sel)if(form.elements[k])form.elements[k].value=sel[k];
  if(spec.hook)spec.hook(form,isNew);
  const back=repOpen;repOpen=null;
  const k=e=>{if(e.key==="Escape")close()};
  const close=()=>{document.removeEventListener("keydown",k);$("#sheetRoot").innerHTML="";if(back&&rep(back))openRep(back)};
  $("#sx").onclick=close;$("#cancel").onclick=close;$("#sb").addEventListener("mousedown",e=>{if(e.target.id==="sb")close()});
  document.addEventListener("keydown",k);
  const first=form.querySelector("input:not([type=checkbox]),select");if(first)first.focus();
  let armed=false;
  if($("#del"))$("#del").onclick=async()=>{if(!armed){armed=true;$("#del").textContent="Tap again to delete";return}
    try{await db.collection(col).doc(id).delete();close();toast("Deleted")}catch(e){toast(errMsg(e))}};
  form.onsubmit=async e=>{e.preventDefault();
    const bad=[...form.querySelectorAll("[required]")].find(x=>!String(x.value).trim());if(bad){bad.focus();toast("Fill in "+(form.querySelector(`label[for="${bad.id}"]`)||{}).textContent);return}
    const data={};[...form.elements].forEach(el=>{if(!el.name)return;data[el.name]=el.type==="checkbox"?el.checked:el.value.trim()});
    (spec.num||[]).forEach(k=>{if(k in data)data[k]=num(data[k])});
    if(col==="territories"){data.repIds=Object.keys(data).filter(k=>k.startsWith("r_")&&data[k]).map(k=>k.slice(2));Object.keys(data).filter(k=>k.startsWith("r_")).forEach(k=>delete data[k]);if(data.end&&data.start&&data.end<data.start){toast("End date is before the start");return}}
    if(col==="reps"){if(data.managerId===id)data.managerId="";if(id&&data.managerId&&downline(id).includes(data.managerId)){toast("That would put them under their own team");return}}
    if(col==="incentives"&&data.end<data.start){toast("End date is before the start");return}
    data.updatedAt=new Date().toISOString();
    try{
      if(col==="reps"&&data.me){for(const r of D.reps)if(r.me&&r.id!==id)await db.collection("reps").doc(r.id).update({me:false})}
      if(isNew){data.createdAt=data.updatedAt;await db.collection(col).add(data)}else{const body=Object.assign({},rec,data);delete body.id;await db.collection(col).doc(id).set(body)}
      close();toast(isNew?"Saved":"Updated");
    }catch(err){toast(errMsg(err))}
  };
}

function errMsg(e){const c=e&&e.code;if(c==="invalid_argument")return"Couldn't save. You may not have edit access.";if(c==="quota_exceeded")return"Storage is full. Delete old entries to add more.";return"Couldn't save. Try again."}
let tt;function toast(m){clearTimeout(tt);let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;tt=setTimeout(()=>el.remove(),2400)}

  const pvb=e.target.closest("[data-pv],[data-pvexit]");if(pvb&&pvb.tagName==="BUTTON"){if(pvb.dataset.pvexit){previewRep=null;tab="mine"}else{previewRep=pvb.dataset.pv;tab="r_home"}window.scrollTo(0,0);render();return}

  const gb=e.target.closest("[data-gtype],[data-gset],[data-gedit]");
  if(gb){const id=RV()||ST.m.id||(me()||{}).id;
    if(gb.dataset.gtype){ST.gtype=gb.dataset.gtype;ST.gedit=false;render()}
    else if(gb.dataset.gedit){ST.gedit=gb.dataset.gedit==="1";render()}
    else{const t="pay",v=gb.dataset.gset==="custom"?num(($("#gcustom")||{}).value):num(gb.dataset.gset);if(!v){toast("Enter a number");return}
      if(previewRep){toast("Preview only. Reps set their own goal.");return}saveGoal(id,t,v)}
    return}
  if(e.target.closest("[data-more]")){openMore();return}
  if(e.target.closest("[data-moreclose]"))closeMore();
  const ab=e.target.closest("#acctBtn");if(ab){const m=$("#acctMenu");m.hidden=!m.hidden;ab.setAttribute("aria-expanded",String(!m.hidden));return}
  if(!e.target.closest(".acct")&&$("#acctMenu"))$("#acctMenu").hidden=true;
  const thb=e.target.closest("[data-theme-set]");if(thb){THEME=thb.dataset.themeSet;try{localStorage.setItem(THK,THEME)}catch(err){}applyTheme(THEME);return}
  const rpb=e.target.closest("[data-rpk]");if(rpb){ST.rpk=rpb.dataset.rpk;if(rpb.dataset.tab)tab=rpb.dataset.tab;window.scrollTo(0,0);render();return}
  const lbb=e.target.closest("[data-lb]");if(lbb){ST.m.lb=lbb.dataset.lb;render();return}
  const rs=e.target.closest("[data-rstmt]");if(rs){repStmt(rs.dataset.rstmt);return}
  const qh=e.target.closest("[data-logout],[data-logtoggle],[data-invite],[data-revoke],[data-copy],[data-recruit],[data-share],[data-appr],[data-decl],[data-mgrinv]");
  if(qh&&window.QHQ){const Q=window.QHQ;
    if(qh.dataset.logout)Q.logout();
    else if(qh.dataset.logtoggle){LOGOPEN=!LOGOPEN;if(LOGOPEN)Q.loadUsers().then(render);else render()}
    else if(qh.dataset.invite){const r=rep(qh.dataset.invite);Q.invite(r.id,r.email).then(x=>{LINKS[r.id]=x.link;return Q.loadUsers()}).then(render).catch(err=>toast(err.message))}
    else if(qh.dataset.revoke){Q.revoke(qh.dataset.revoke).then(()=>Q.loadUsers()).then(()=>{toast("Login removed");render()}).catch(err=>toast(err.message))}
    else if(qh.dataset.mgrinv){const em=qh.dataset.mgrinv==="new"?(($("#mgremail")||{}).value||"").trim():qh.dataset.mgrinv;Q.api("POST","/api/users/invite",{email:em,role:"manager"}).then(x=>{LINKS._mgr=x.link;return Q.loadUsers()}).then(render).catch(err=>toast(err.message))}
    else if(qh.dataset.recruit){Q.recruitLink().then(x=>{RLINK=x.link;render()}).catch(err=>toast(err.message))}
    else if(qh.dataset.share){navigator.share({title:"Join my team at Quota",url:qh.dataset.share}).catch(()=>{})}
    else if(qh.dataset.appr){const a=(Q.applicants||[]).find(x=>String(x.id)===qh.dataset.appr),sc=num(($("#asc-"+qh.dataset.appr)||{}).value);if(!sc){toast("Set a pay scale first");return}Q.approve(qh.dataset.appr,sc).then(x=>{ALINKS[a?a.name.split(" ")[0]:"them"]=x.link;toast((a?a.name:"Rep")+" added");render()}).catch(err=>toast(err.message))}
    else if(qh.dataset.decl){Q.decline(qh.dataset.decl).then(()=>{toast("Declined");render()}).catch(err=>toast(err.message))}
    else if(qh.dataset.copy){try{navigator.clipboard.writeText(qh.dataset.copy);toast("Link copied")}catch(err){toast("Select the link and copy it")}}
    return}
  const cl=e.target.closest("[data-claim],[data-approve],[data-deny]");
  if(cl){if(cl.dataset.claim){const v=$("#lpick")&&$("#lpick").value;if(!v){toast("Pick your name first");return}
      db.collection("claims").doc(myUid).set({repId:v,who:myName||"",email:myEmail||"",at:new Date().toISOString()}).then(()=>{toast("Request sent to Aidan");CLAIMS=[{id:myUid,repId:v}];render()}).catch(()=>toast("Couldn't send. Try again."))}
    else if(cl.dataset.approve){const c=CLAIMS.find(x=>x.id===cl.dataset.approve);if(!c)return;db.collection("reps").doc(c.repId).update({userId:c.id}).then(()=>db.collection("claims").doc(c.id).delete()).then(()=>toast(repName(c.repId)+" can now see their pay")).catch(()=>toast("Couldn't approve"))}
    else{db.collection("claims").doc(cl.dataset.deny).delete().catch(()=>toast("Couldn't dismiss"))}return}
  const t=e.target.closest("[data-paygoal],[data-stmt],[data-addexp],[data-savegoals],[data-pw],[data-tab],[data-add],[data-edit],[data-rep],[data-editrep],[data-logfor],[data-close],[data-sort],[data-view],[data-bulk],[data-payout]");if(!t)return;
  const d=t.dataset;if(t.closest("#gres")){$("#gres").hidden=true;$("#gsearch").value=""}
  if(d.paygoal){savePayGoal(d.paygoal)}
  else if(d.stmt){saveStmt(d.stmt)}
  else if(d.addexp){openForm("expenses",null,{payday:d.addexp,date:today(),category:"Travel"})}
  else if(t.hasAttribute("data-savegoals")){saveGoals()}
  else if(t.hasAttribute("data-pw")){payWk=d.pw;render()}
  else if(d.tab){tab=d.tab;try{history.replaceState(null,"","#"+tab)}catch(_){}selS.clear();render();window.scrollTo(0,0)}
  else if(d.add)openForm(d.add);
  else if(d.edit)d.edit==="reps"?openRep(d.id):openForm(d.edit,d.id);
  else if(d.rep)openRep(d.rep);
  else if(d.editrep)openForm("reps",d.editrep);
  else if(d.logfor)openForm("sales",null,{repId:d.logfor});
  else if(t.hasAttribute("data-close"))closeSheet();
  else if(d.sort){const [o,k]=d.sort.split(".");const S=ST[o];if(S.sort===k)S.dir=S.dir==="asc"?"desc":"asc";else{S.sort=k;S.dir=["date","installed","pw","inst","pend","sold","qty","pay","rev","comm","ovr","owed","rate"].includes(k)?"desc":"asc"}render()}
  else if(d.view){const [o,v]=d.view.split(".");ST[o].view=v;render()}
  else if(d.bulk)bulk(d.bulk);
  else if(d.payout){if(d.armed){payout(d.payout)}else{d.armed="1";t.textContent="Confirm";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent="Mark paid"}},4000)}}
});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.f;if(!k)return;if(k==="pv"){previewRep=e.target.value;render();return}if(k==="lp"){linkPick=e.target.value;return}const [o,f]=k.split(".");ST[o][f]=e.target.value;render()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#gres").hidden){$("#gres").hidden=true;return}if(repOpen)closeSheet()});
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".dc");if(!c)return;e.dataTransfer.setData("text/plain",c.dataset.id);e.dataTransfer.effectAllowed="move";c.classList.add("drag")});
document.addEventListener("dragend",()=>document.querySelectorAll(".drag,.over").forEach(x=>x.classList.remove("drag","over")));
document.addEventListener("dragover",e=>{const col=e.target.closest&&e.target.closest(".col");if(!col)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",async e=>{const col=e.target.closest&&e.target.closest(".col");if(!col)return;e.preventDefault();col.classList.remove("over");
  const id=e.dataTransfer.getData("text/plain"),s=D.sales.find(x=>x.id===id),st=col.dataset.col;if(!s||s.status===st)return;
  const u={status:st};if(st==="done"&&!s.installDate)u.installDate=today();
  try{await db.collection("sales").doc(id).update(u);toast(st==="done"?"Marked installed":st==="cancelled"?"Marked cancelled":"Moved to pending")}catch(err){toast(errMsg(err))}});
const gs=$("#gsearch"),gr=$("#gres");
gs.addEventListener("input",()=>{const q=gs.value.trim().toLowerCase();if(!q){gr.hidden=true;return}
  const hit=(...f)=>f.some(x=>String(x||"").toLowerCase().includes(q));
  const rs=D.reps.filter(r=>hit(r.name,r.market,r.phone,r.role)).slice(0,5),ss=D.sales.filter(s=>hit(s.customer,s.provider,s.product,s.notes)).slice(0,8),es=D.expenses.filter(x=>hit(x.note,x.market,x.category)).slice(0,4),is=D.incentives.filter(x=>hit(x.name,x.note)).slice(0,3);
  const g=(t,a,f)=>a.length?`<div class="grp">${t}</div>`+a.map(f).join(""):"";
  gr.innerHTML=(g("Reps",rs,r=>`<button type="button" data-rep="${r.id}"><span class="av">${esc(initials(r.name))}</span>${esc(r.name)}<small>${esc(r.role||"Rep")}</small></button>`)+
    g("Sales",ss,s=>`<button type="button" data-edit="sales" data-id="${s.id}">${esc(s.customer)||esc(s.product)}<small>${esc(s.provider)} · ${esc(repName(s.repId))} · ${fmtD(s.date)}</small></button>`)+
    g("Expenses",es,x=>`<button type="button" data-edit="expenses" data-id="${x.id}">${esc(x.note)||esc(x.category)}<small>${money(num(x.amount))} · ${fmtD(x.date)}</small></button>`)+
    g("Incentives",is,x=>`<button type="button" data-edit="incentives" data-id="${x.id}">${esc(x.name)}<small>Ends ${fmtD(x.end)}</small></button>`))||`<p class="sub" style="padding:10px;margin:0">No matches for "${esc(gs.value)}"</p>`;
  gr.hidden=false});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-edit][role=button]")){e.preventDefault();e.target.click()}});
$("#period").addEventListener("change",render);


/* ---------- data ---------- */
renderTabs();
(async()=>{
  try{db=await window.claude.use("db")}catch(e){db=null}
  try{const u=await window.claude.use("user");if(u){canEdit=!!(await u.canEdit());const mi=await u.me();myUid=mi.id;myName=mi.name||"";myEmail=mi.email?mi.email.trim().toLowerCase():null}}catch(e){}
  if(!db){$("#view").innerHTML=`<div class="card empty"><b>Tracker data isn't available here</b>Open this page in claude.ai while signed in to your organization to see and log sales.</div>`;return}
  const RAW={};const hydrate=()=>{if(window.QHQ&&window.QHQ.pre){D.sales=(RAW.sales||[]).slice();return}const RP=D.reps||[],QS={},byId={};RP.forEach(r=>{byId[r.id]=r;if(r.quotaStart)QS[r.id]=r.quotaStart});
  const top=RP.find(r=>r.me),topSc=top&&num(top.scale)?num(top.scale):300;
  const sc=(r,d)=>{if(!r)return null;if(num(r.scale2)&&r.scale2From&&d>=r.scale2From)return num(r.scale2);return num(r.scale)?num(r.scale):null};
  D.sales=(RAW.sales||[]).map(s=>{const q=QS[s.repId];if(q&&(s.date||"")<q)return null;
    const rt=findRate(s.type||"fiber",s.provider,s.product,s.repId),rev=(s.revenue!==undefined&&s.revenue!==null&&s.revenue!=="")?num(s.revenue):(rt?num(rt.revenue):0);
    const d=(s.status==="done"&&(s.installDate||s.date))||s.date||"",delta=rev-topSc,chain=[],seen=new Set();let r=byId[s.repId];
    while(r&&!seen.has(r.id)){seen.add(r.id);chain.push(r);r=byId[r.managerId]}
    const ss=sc(chain[0],d),ovr={};let rp=0;
    if(ss!=null){rp=Math.max(0,ss+delta);let prev=ss;for(let i=1;i<chain.length;i++){const a=sc(chain[i],d);if(a==null)break;if(a-prev>0)ovr[chain[i].id]=a-prev;prev=a}}
    return Object.assign({},s,{revenue:rev,repPay:rp,ovr,scaleKnown:ss!=null})}).filter(Boolean)};
  if(canEdit)db.collection("claims").onSnapshot(sn=>{CLAIMS=sn.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(loaded>=COLS.length)render()},()=>{});
  try{if(!canEdit&&myUid)db.doc("data/users/"+myUid+"/prefs").get().then(d=>{if(d&&d.exists){MYPREF=d.data()||{};MYGOAL=num(MYPREF.payGoal);if(loaded>=COLS.length)render()}}).catch(()=>{});}catch(e){}
  if(!canEdit&&myUid)db.collection("claims").doc(myUid).get().then(d=>{if(d&&d.exists){CLAIMS=[Object.assign({},d.data(),{id:myUid})];if(loaded>=COLS.length)render()}}).catch(()=>{});
  COLS.forEach(c=>{let first=true;db.collection(c).onSnapshot(snap=>{RAW[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));D[c]=RAW[c];if(c==="sales"||c==="rates"||c==="reps")hydrate();if(first){first=false;loaded++}if(loaded>=COLS.length)render()},err=>{toast("Lost connection to "+c)})});
})();
})();
</script>
